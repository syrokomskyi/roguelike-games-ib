$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:werkstatt:schema:knowledge-extractor:1
title: Trusted Knowledge Extractor Manifest v1
type: object
additionalProperties: false
required:
  - schema
  - extractor_id
  - extractor_version
  - source_kinds
  - record_kinds
  - parser_mode
  - deterministic
  - executes_source_code
  - inputs
properties:
  schema:
    const: werkstatt/knowledge-extractor@1
  extractor_id:
    type: string
    pattern: '^[a-z0-9][a-z0-9._-]*$'
  extractor_version:
    type: string
    minLength: 1
  source_kinds:
    type: array
    minItems: 1
    items: {type: string}
  record_kinds:
    type: array
    minItems: 1
    items: {type: string}
  parser_mode:
    enum: [static, sandboxed_execution]
  deterministic:
    const: true
  executes_source_code:
    type: boolean
  source_execution_adr:
    type: [string, 'null']
  inputs:
    type: object
    additionalProperties: false
    required: [include, exclude]
    properties:
      include:
        type: array
        items: {type: string}
      exclude:
        type: array
        items: {type: string}
  coverage_contract:
    type: object
    additionalProperties: true
