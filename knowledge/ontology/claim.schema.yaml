$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:rgkb:schema:claim:2
title: Claim Record v2
allOf:
  - $ref: urn:rgkb:schema:record:2
  - type: object
    required:
      - subject_id
      - predicate
      - assertion_state
      - evidence_refs
    oneOf:
      - required: [object_ref]
        properties:
          object_ref:
            type: string
            pattern: '^urn:roguelike-games-ib:record:[0-9a-fA-F-]{36}$'
      - required: [value]
        properties:
          value: {}
    properties:
      schema:
        const: rgkb/claim@2
      record_type:
        const: claim
      subject_id:
        type: string
        pattern: '^urn:roguelike-games-ib:record:[0-9a-fA-F-]{36}$'
      predicate:
        type: string
        pattern: '^[a-z][a-z0-9_.-]*$'
      object_ref:
        type: string
        pattern: '^urn:roguelike-games-ib:record:[0-9a-fA-F-]{36}$'
      value: {}
      assertion_state:
        enum: [supported, contested]
      evidence_refs:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          pattern: '^urn:roguelike-games-ib:record:[0-9a-fA-F-]{36}$'
      limitations:
        type: array
        items:
          type: string
