$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:rgkb:schema:game-definition:2
title: GameDefinition v2
allOf:
  - $ref: urn:rgkb:schema:record:2
  - type: object
    required:
      - kind
      - native_kind
      - name
      - source_identity
      - attributes
      - evidence_refs
    properties:
      schema:
        const: rgkb/game-definition@2
      record_type:
        const: game_definition
      kind:
        type: string
        minLength: 1
      native_kind:
        type: string
        minLength: 1
      name:
        type: object
        additionalProperties: false
        required: [canonical, original]
        properties:
          canonical:
            type: string
            minLength: 1
          original:
            type: string
            minLength: 1
      source_identity:
        type: object
        additionalProperties: false
        required: [native_id]
        properties:
          native_id:
            type: string
            minLength: 1
          namespace:
            type: [string, 'null']
      activation:
        enum: [active, conditionally_active, disabled, test_only, debug_only, unknown]
      attributes:
        type: object
        additionalProperties: true
      evidence_refs:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          pattern: '^urn:roguelike-games-ib:record:[0-9a-fA-F-]{36}$'
