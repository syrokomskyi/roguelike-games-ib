name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Materialize
        run: pnpm materialize
      - name: Build check
        run: pnpm exec turbo run build:check
      - name: Test
        run: pnpm exec vitest --run
      - name: Verify
        run: pnpm exec turbo run verify
      - name: Knowledge base health summary
        run: pnpm exec tsx scripts/kb-health-summary.ts
      - name: Dataset release check
        run: |
          node -e "
          const fs = require('fs');
          const { parse: parseYaml } = require('yaml');
          const manifest = parseYaml(fs.readFileSync('knowledge/manifest.yaml', 'utf-8'));
          
          if (!manifest.dataset_version) {
            console.error('FAIL: manifest.yaml must have dataset_version');
            process.exit(1);
          }
          
          const semverRe = /^\d+\.\d+\.\d+(-[a-zA-Z0-9.-]+)?$/;
          if (!semverRe.test(manifest.dataset_version)) {
            console.error('FAIL: dataset_version must be valid SemVer, got: ' + manifest.dataset_version);
            process.exit(1);
          }
          
          if (manifest.version_history) {
            const { execSync } = require('child_process');
            try {
              const diff = execSync('git diff HEAD~1 -- knowledge/manifest.yaml', { encoding: 'utf-8' });
              const lines = diff.split('\n');
              const removedLines = lines.filter(l => l.startsWith('-') && !l.startsWith('---') && l.includes('version:'));
              if (removedLines.length > 0) {
                console.error('FAIL: version_history is append-only — detected modification of existing entries');
                console.error(removedLines.join('\n'));
                process.exit(1);
              }
            } catch {
              // No previous commit (first commit) — skip append-only check
            }
          }
          
          console.log('PASS: dataset_version=' + manifest.dataset_version);
          "
