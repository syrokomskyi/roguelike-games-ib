name: Deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'deploy:')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build:check
      - run: pnpm exec vitest --run
      - name: Deploy Search API
        run: pnpm search-api:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Index embeddings
        run: pnpm index:embeddings
        env:
          SEARCH_API_URL: ${{ secrets.SEARCH_API_URL }}
          INDEXING_TOKEN: ${{ secrets.INDEXING_TOKEN }}
      - name: Build web app
        run: pnpm exec turbo run build:web
      - name: Deploy Web App
        run: pnpm --filter @roguelike-games-ib/web exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
